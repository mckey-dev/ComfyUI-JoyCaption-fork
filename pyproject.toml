[project]
name = "ComfyUI-JoyCaption-fork"
version = "1.0.0"
description = "Fork of ComfyUI-JoyCaption. Local GGUF image captioning in ComfyUI via llama-cli, with keep_in_ram."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.19.0",
    "numpy",
    "Pillow>=10.0.0",
]

[project.urls]
Repository = "https://github.com/mckey-dev/ComfyUI-JoyCaption-fork"

[tool.comfy]
DisplayName = "JoyCaption (fork)"
